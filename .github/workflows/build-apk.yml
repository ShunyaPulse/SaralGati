name: Build Android APK & Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Rename APK to SaralGati.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/SaralGati.apk

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "SaralGati Android App (Latest)"
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/SaralGati.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
