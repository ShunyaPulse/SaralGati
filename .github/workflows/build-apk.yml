name: Build Android APK & Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'version.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version Code Override'
        required: false
        type: string
      version_name:
        description: 'Version Name Override'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
        env:
          BUILD_NUMBER: ${{ inputs.version_code }}
          BUILD_VERSION: ${{ inputs.version_name }}

      - name: Rename APK to SaralGati.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/SaralGati.apk

      - name: Upload Release Asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: android-latest
          name: "SaralGati Android App (Latest)"
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/SaralGati.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
