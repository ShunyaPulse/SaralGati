name: Build Android APK & Release

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "version.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version Code Override"
        required: false
        type: string
      version_name:
        description: "Version Name Override"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Setup Release Keystore
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "Decoding production release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          elif [ ! -f "keystore.jks" ]; then
            echo "Generating fallback keystore for release build..."
            keytool -genkey -v -keystore keystore.jks -alias saralgati_key -keyalg RSA -keysize 2048 -validity 10000 -storepass "$FALLBACK_PASSWORD" -keypass "$FALLBACK_PASSWORD" -dname "CN=SaralGati,O=SaralGati,C=IN"
          fi
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          FALLBACK_PASSWORD: "saralgati_fallback"

      - name: Determine Version
        id: version
        env:
          INPUT_CODE: ${{ inputs.version_code }}
          INPUT_NAME: ${{ inputs.version_name }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          BASE_VERSION=$(jq -r '.version_name' version.json 2>/dev/null || echo "6.0.0")
          BASE_CODE=$(jq -r '.version_code' version.json 2>/dev/null || echo "$RUN_NUM")
          DOWNLOAD_URL=$(jq -r '.download_url // "https://saralgati-685823552970.asia-south1.run.app/api/download"' version.json 2>/dev/null)
          FORCE_UPDATE=$(jq -r '.force_update // false' version.json 2>/dev/null)
          CHANGELOG=$(jq -r '.changelog // ""' version.json 2>/dev/null)
          CODE="${INPUT_CODE:-$BASE_CODE}"
          if [ "$CODE" -lt "$RUN_NUM" ]; then
            CODE="$RUN_NUM"
          fi
          NAME="${INPUT_NAME:-$BASE_VERSION}"
          RELEASE_BODY=$(jq -cn \
            --argjson code "$CODE" \
            --arg name "$NAME" \
            --arg url "$DOWNLOAD_URL" \
            --argjson force "$FORCE_UPDATE" \
            --arg log "$CHANGELOG" \
            '{version_code: $code, version_name: $name, download_url: $url, force_update: $force, changelog: $log}')
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "release_body=$RELEASE_BODY" >> "$GITHUB_OUTPUT"

      - name: Build Hardened Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
          BUILD_VERSION: ${{ steps.version.outputs.name }}
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          API_SECRET: ${{ secrets.API_SECRET || secrets.FLYWHEEL_SECRET }}

      - name: Prepare Release APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/SaralGati.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/SaralGati.apk
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: android-latest
          name: "SaralGati Android App (v${{ steps.version.outputs.name }})"
          body: ${{ steps.version.outputs.release_body }}
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/release/SaralGati.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
