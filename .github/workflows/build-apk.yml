name: Build Android APK & Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'version.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version Code Override'
        required: false
        type: string
      version_name:
        description: 'Version Name Override'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Decode Release Keystore (if present)
        if: env.HAS_KEYSTORE == 'true'
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

      - name: Build Hardened Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
        env:
          BUILD_NUMBER: ${{ inputs.version_code }}
          BUILD_VERSION: ${{ inputs.version_name }}
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Release APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/SaralGati.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/SaralGati.apk
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: android-latest
          name: "SaralGati Android App (Latest)"
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/release/SaralGati.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
