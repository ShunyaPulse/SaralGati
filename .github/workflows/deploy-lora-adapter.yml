name: Deploy LoRA Adapter (Kernel Sweeper)

on:
  schedule:
    # Every hour, five minutes past. The Kaggle kernel runs for hours, so the
    # sweep that wakes up after it finishes is the one that deploys; every
    # other run just reads a status line and exits within seconds.
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check kernel status and deploy if finished
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ] || [ -z "$KAGGLE_USERNAME" ]; then
            echo "::error::KAGGLE_USERNAME / KAGGLE_API_TOKEN are not configured."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN are not configured."
            exit 1
          fi
          pip install kaggle requests --quiet
          python scripts/sweep_deploy_adapter.py
