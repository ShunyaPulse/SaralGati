name: SaralGati Autonomous Self-Learning Flywheel

on:
  schedule:
    # Runs automatically every 1 hour in the cloud at minute 23 (bypasses top-of-hour throttling)
    - cron: "23 * * * *"
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab
    inputs:
      max_cases:
        description: "Maximum test scenarios to simulate"
        required: false
        default: "30"

jobs:
  cloud-self-learning:
    name: Cloud Synthetic Self-Play & Flywheel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Cloud Self-Learning Pipeline
        env:
          SARALGATI_API_URL: ${{ vars.SARALGATI_API_URL || 'https://saralgati-685823552970.asia-south1.run.app' }}
          DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
          API_SECRET: ${{ secrets.API_SECRET }}
          FLYWHEEL_SECRET: ${{ secrets.FLYWHEEL_SECRET }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MAX_CASES: ${{ github.event.inputs.max_cases }}
        run: |
          # Guard: Blackout window during scheduled GPU Training (Wed & Sun 1:30 AM - 4:30 AM IST / 20:00 - 23:00 UTC Tue & Sat)
          IS_MANUAL="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            IS_MANUAL="true"
          fi
          DOW=$(date -u +%u)
          HOUR=$(date -u +%H)
          if [ "$IS_MANUAL" != "true" ] && ([ "$DOW" = "2" ] || [ "$DOW" = "6" ]) && [ "$HOUR" -ge 20 ] && [ "$HOUR" -le 23 ]; then
            echo "⏸️ Training Blackout Active: Kaggle LoRA GPU Training is scheduled around this window (Wed/Sun 2-4 AM IST). Skipping flywheel to prevent database locks."
            exit 0
          fi

          LIMIT_ARG=""
          if [ -n "$INPUT_MAX_CASES" ]; then
            LIMIT_ARG="--limit $INPUT_MAX_CASES"
          fi
          python scripts/cloud_self_learning.py --url "$SARALGATI_API_URL" $LIMIT_ARG
