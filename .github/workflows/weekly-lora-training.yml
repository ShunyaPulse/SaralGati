name: Weekly Autonomous LoRA Training

on:
  schedule:
    # Run every Wednesday & Sunday at 03:00 AM IST (21:30 UTC Tuesday & Saturday)
    - cron: '30 21 * * 2,6'
  workflow_dispatch:
    inputs:
      force_train:
        description: 'Force training even with low sample count'
        required: false
        default: false
        type: boolean

jobs:
  check-and-trigger-training:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Check Training Data Availability
        id: check_data
        env:
          INPUT_FORCE_TRAIN: ${{ inputs.force_train || 'false' }}
        run: |
          API_URL="https://saralgati-685823552970.asia-south1.run.app/api/v1/agent/training-data?status=flywheel&limit=500"
          echo "Fetching verified interactions from: $API_URL"
          COUNT=$(python -c "import urllib.request, json; res = json.loads(urllib.request.urlopen('$API_URL', timeout=15).read()); print(res.get('count', 0))" 2>/dev/null || echo "0")
          echo "Found $COUNT verified elder interactions in database."
          echo "sample_count=$COUNT" >> $GITHUB_OUTPUT
          
          FORCE="$INPUT_FORCE_TRAIN"
          if [ "$COUNT" -ge 10 ] 2>/dev/null || [ "$FORCE" = "true" ]; then
            echo "should_train=true" >> $GITHUB_OUTPUT
            echo "✅ Threshold met ($COUNT samples). Ready for training."
          else
            echo "should_train=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Less than 10 verified samples ($COUNT). Skipping training cycle to save GPU quota."
          fi

      - name: Download Training Dataset
        if: steps.check_data.outputs.should_train == 'true'
        run: |
          curl -s "https://saralgati-685823552970.asia-south1.run.app/api/v1/agent/training-data?status=flywheel&format=jsonl" -o dataset.jsonl
          echo "Downloaded $(wc -l < dataset.jsonl) rows to dataset.jsonl"

      - name: Upload Dataset Artifact
        if: steps.check_data.outputs.should_train == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saralgati-verified-dataset
          path: dataset.jsonl
          retention-days: 14

      - name: Trigger Kaggle GPU Kernel
        if: steps.check_data.outputs.should_train == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ] || [ -z "$KAGGLE_USERNAME" ]; then
            echo "⚠️ KAGGLE_API_TOKEN or KAGGLE_USERNAME is empty. Skipping Kaggle run."
            exit 0
          fi
          pip install kaggle
          
          echo "📦 Isolating Kaggle files..."
          mkdir -p kaggle_push
          cp scripts/train_unsloth_lora.py kaggle_push/
          
          echo "🔄 Updating kernel-metadata.json with correct Kaggle username..."
          USERNAME_LOWER=$(echo "$KAGGLE_USERNAME" | tr '[:upper:]' '[:lower:]')
          jq --arg username "$USERNAME_LOWER" '.id = $username + "/saralgati-lora-training"' scripts/kernel-metadata.json > kaggle_push/kernel-metadata.json
          
          echo "🔑 Auto-injecting Cloudflare deploy credentials..."
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            sed -i "s|CLOUDFLARE_ACCOUNT_ID = os.environ.get(\"CLOUDFLARE_ACCOUNT_ID\")|CLOUDFLARE_ACCOUNT_ID = \"$CLOUDFLARE_ACCOUNT_ID\"|" kaggle_push/train_unsloth_lora.py
            sed -i "s|CLOUDFLARE_API_TOKEN = os.environ.get(\"CLOUDFLARE_API_TOKEN\")|CLOUDFLARE_API_TOKEN = \"$CLOUDFLARE_API_TOKEN\"|" kaggle_push/train_unsloth_lora.py
            echo "✅ Cloudflare credentials injected into isolated Kaggle script."
          else
            echo "⚠️ Cloudflare secrets not set; skipping injection."
          fi
          
          echo "🚀 Triggering Kaggle GPU kernel for autonomous fine-tuning..."
          kaggle kernels push -p kaggle_push/
