name: Bi-Weekly Autonomous LoRA Training

on:
  schedule:
    # Run every Wednesday & Sunday at 03:00 AM IST (21:30 UTC Tuesday & Saturday)
    - cron: "30 21 * * 2,6"
  workflow_dispatch:
    inputs:
      force_train:
        description: "Force training even with low sample count"
        required: false
        default: false
        type: boolean

jobs:
  check-and-trigger-training:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check Training Data Availability
        id: check_data
        env:
          INPUT_FORCE_TRAIN: ${{ inputs.force_train || 'false' }}
          FLYWHEEL_SECRET: ${{ secrets.FLYWHEEL_SECRET }}
          API_URL: "https://saralgati-685823552970.asia-south1.run.app/api/v1/agent/training-data?status=flywheel&limit=10000"
        run: |
          if [ -z "$FLYWHEEL_SECRET" ]; then
            echo "::error::FLYWHEEL_SECRET is not configured; the training-data export requires it."
            exit 1
          fi

          echo "Fetching verified interactions from: $API_URL"
          BODY=$(curl -fsS -H "x-flywheel-secret: $FLYWHEEL_SECRET" "$API_URL")
          COUNT=$(printf '%s' "$BODY" | python -c "import json,sys; print(json.load(sys.stdin).get('count', 0))" 2>/dev/null || echo "0")
          echo "Found $COUNT verified elder interactions in database."
          # The pool is bilingual now: show the split, so a Hindi-only pool is
          # visible here instead of only showing up as a Hinglish adapter later.
          printf '%s' "$BODY" | python -c "import json,sys; pool=json.load(sys.stdin); c=pool.get('counts') or {}; print(f\"Language split: hi={c.get('hi',0)} en={c.get('en',0)} | dropped (wrong script): {pool.get('skipped_wrong_script',0)}\")" 2>/dev/null || true
          echo "sample_count=$COUNT" >> $GITHUB_OUTPUT

          FORCE="$INPUT_FORCE_TRAIN"
          if [ "$COUNT" -ge 50 ] 2>/dev/null || [ "$FORCE" = "true" ]; then
            echo "should_train=true" >> $GITHUB_OUTPUT
            echo "✅ Threshold met ($COUNT samples). Ready for daily training."
          else
            echo "should_train=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Less than 50 verified samples ($COUNT). Skipping to save GPU quota."
          fi

      - name: Download Training Dataset
        if: steps.check_data.outputs.should_train == 'true'
        env:
          FLYWHEEL_SECRET: ${{ secrets.FLYWHEEL_SECRET }}
        run: |
          # -f so an auth failure aborts instead of saving the error body as a
          # dataset that then gets uploaded as a training artifact.
          curl -fsS -H "x-flywheel-secret: $FLYWHEEL_SECRET" \
            "https://saralgati-685823552970.asia-south1.run.app/api/v1/agent/training-data?status=flywheel&format=jsonl&limit=10000" \
            -o dataset.jsonl
          echo "Downloaded $(wc -l < dataset.jsonl) SFT rows to dataset.jsonl"

      - name: Download Fraud Training Dataset
        if: steps.check_data.outputs.should_train == 'true'
        env:
          FLYWHEEL_SECRET: ${{ secrets.FLYWHEEL_SECRET }}
        run: |
          curl -fsS -H "x-flywheel-secret: $FLYWHEEL_SECRET" \
            "https://saralgati-685823552970.asia-south1.run.app/api/v1/agent/training-data?type=fraud&mode=sft&format=jsonl&limit=10000" \
            -o fraud_dataset.jsonl 2>/dev/null || true
          if [ -s fraud_dataset.jsonl ]; then
            FRAUD_LINES=$(wc -l < fraud_dataset.jsonl)
            echo "Downloaded $FRAUD_LINES fraud training rows"
            cat fraud_dataset.jsonl >> dataset.jsonl
          else
            echo "No fraud training data available yet, skipping."
          fi
          echo "Total dataset: $(wc -l < dataset.jsonl) rows"

      - name: Upload Dataset Artifact
        if: steps.check_data.outputs.should_train == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saralgati-verified-dataset
          path: dataset.jsonl
          retention-days: 14

      - name: Publish Verified Dataset to Kaggle
        id: publish_dataset
        if: steps.check_data.outputs.should_train == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ] || [ -z "$KAGGLE_USERNAME" ]; then
            echo "⚠️ KAGGLE_API_TOKEN or KAGGLE_USERNAME is empty. Skipping Kaggle run."
            exit 0
          fi
          pip install kaggle

          USERNAME_LOWER=$(echo "$KAGGLE_USERNAME" | tr '[:upper:]' '[:lower:]')
          DATASET_ID="$USERNAME_LOWER/saralgati-verified-training-set"

          # The runner reads the pool from /kaggle/input/, so it must be published
          # as a dataset first. A sibling file is never uploaded by kernels push,
          # and embedding it in the script exceeds Kaggle's 1 MB source limit.
          echo "📦 Packaging verified dataset for Kaggle..."
          python scripts/bundle_dataset.py dataset.jsonl kaggle_dataset "$USERNAME_LOWER"

          # `create` fails once the dataset exists, so fall back to a new version.
          kaggle datasets create -p kaggle_dataset \
            || kaggle datasets version -p kaggle_dataset -m "Verified refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # A kernel can only attach a dataset that has finished processing.
          READY="false"
          for attempt in $(seq 1 12); do
            STATUS=$(kaggle datasets status "$DATASET_ID" 2>&1 || true)
            echo "Attempt $attempt: $STATUS"
            if printf '%s' "$STATUS" | grep -qi ready; then
              READY="true"
              break
            fi
            sleep 10
          done
          if [ "$READY" != "true" ]; then
            echo "::error::Dataset $DATASET_ID did not become ready; not launching a training run."
            exit 1
          fi
          echo "dataset_id=$DATASET_ID" >> $GITHUB_OUTPUT

      - name: Trigger Kaggle GPU Kernel
        id: trigger_kernel
        if: steps.check_data.outputs.should_train == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATASET_ID: ${{ steps.publish_dataset.outputs.dataset_id }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ] || [ -z "$KAGGLE_USERNAME" ]; then
            echo "⚠️ KAGGLE_API_TOKEN or KAGGLE_USERNAME is empty. Skipping Kaggle run."
            exit 0
          fi
          # Refuse to run without the dataset: that is exactly how a run silently
          # trained on the six seed samples and still reported success.
          if [ -z "$DATASET_ID" ]; then
            echo "::error::No dataset was published. Refusing to launch a run that would train on seed data."
            exit 1
          fi
          pip install kaggle

          echo "📦 Isolating Kaggle files..."
          mkdir -p kaggle_push
          cp scripts/train_unsloth_lora.py kaggle_push/

          echo "🔄 Updating kernel-metadata.json with the Kaggle username and dataset source..."
          USERNAME_LOWER=$(echo "$KAGGLE_USERNAME" | tr '[:upper:]' '[:lower:]')
          jq --arg username "$USERNAME_LOWER" --arg dataset "$DATASET_ID" \
            '.id = $username + "/saralgati-lora-training" | .dataset_sources = [$dataset]' \
            scripts/kernel-metadata.json > kaggle_push/kernel-metadata.json

          echo "🔑 Checking deploy credentials..."
          python scripts/inject_kaggle_secrets.py

          echo "🚀 Triggering Kaggle GPU kernel for autonomous fine-tuning..."
          kaggle kernels push -p kaggle_push/
          echo "kernel_id=$(jq -r .id kaggle_push/kernel-metadata.json)" >> $GITHUB_OUTPUT

      - name: Wait for Kaggle Kernel and Deploy Adapter
        if: steps.check_data.outputs.should_train == 'true'
        timeout-minutes: 150
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KERNEL_ID: ${{ steps.trigger_kernel.outputs.kernel_id }}
        run: |
          if [ -z "$KERNEL_ID" ]; then
            echo "::error::No Kaggle kernel was pushed, so no adapter can be deployed."
            exit 1
          fi
          pip install requests

          # Pushing a kernel only queues it, so without this wait the job used to
          # go green seconds after the push and never noticed that training died
          # or that the adapter was never deployed.
          echo "⏳ Waiting for $KERNEL_ID to finish..."
          STATUS=""
          for attempt in $(seq 1 180); do
            STATUS=$(kaggle kernels status "$KERNEL_ID" 2>&1 || true)
            echo "Attempt $attempt/180: $STATUS"
            case "$STATUS" in
              *COMPLETE*) break ;;
              *ERROR*|*CANCEL*) echo "::error::Kaggle kernel ended as: $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          if ! printf '%s' "$STATUS" | grep -qi complete; then
            echo "::error::Timed out waiting for $KERNEL_ID ($STATUS)."
            exit 1
          fi

          echo "⬇️ Downloading the trained adapter from the kernel output..."
          kaggle kernels output "$KERNEL_ID" -p kaggle_output

          ADAPTER_DIR=$(dirname "$(find kaggle_output -name adapter_model.safetensors | head -1)")
          if [ -z "$ADAPTER_DIR" ] || [ "$ADAPTER_DIR" = "." ]; then
            echo "::error::The kernel produced no adapter_model.safetensors; nothing to deploy."
            exit 1
          fi
          echo "Found adapter files in: $ADAPTER_DIR"

          # Deployed from CI because the Cloudflare credentials are repository
          # secrets here: Kaggle's UserSecrets service is not reliable inside a
          # pushed batch kernel, and a deploy that silently does nothing leaves
          # the old adapter live. A failure below fails the workflow.
          python scripts/train_unsloth_lora.py --deploy-only "$ADAPTER_DIR"
